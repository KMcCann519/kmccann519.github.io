<!DOCTYPE html>
<html>
<head>
  <title>The Mirage Welcome Screen</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* BACKGROUND VIDEO */

    .background-video {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: -2;

      filter: brightness(55%);
    }

    /* OVERLAY */

    .overlay {
      position: fixed;
      inset: 0;

      background:
      linear-gradient(
        to bottom,
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.05),
        rgba(0,0,0,0.45)
      );

      z-index: -1;
    }

    /* TOP BAR */

    .top-bar {
      position: fixed;

      top: 22px;
      left: 35px;
      right: 35px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 20;

      font-size: 22px;
      letter-spacing: 1px;
    }

    .top-info {
      display: flex;
      gap: 24px;
      align-items: center;

      background: rgba(0,0,0,0.28);

      padding: 10px 20px;

      border-radius: 999px;

      backdrop-filter: blur(10px);

      border: 1px solid rgba(255,255,255,0.15);
    }

    .weather-link {
      color: white;
      text-decoration: none;
      transition: 0.2s;
    }

    .weather-link:hover {
      color: #ffd36d;
    }

    .top-icons {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .top-icon {
      width: 54px;
      height: 54px;

      border-radius: 50%;

      background: rgba(255,255,255,0.18);

      border: 1px solid rgba(255,255,255,0.25);

      display: grid;
      place-items: center;

      font-size: 24px;

      backdrop-filter: blur(10px);

      cursor: pointer;

      transition: 0.25s;
    }

    .top-icon:hover {

      background: rgba(255,255,255,0.28);

    }

    /* MAIN LOGO */

    .main-logo {
      position: fixed;

      top: 115px;

      width: 100%;

      text-align: center;

      z-index: 10;
    }

    .logo {
      width: 430px;
      max-width: 75vw;

      mix-blend-mode: screen;

      filter:
      drop-shadow(0 0 16px rgba(255,215,120,0.45));
    }

    .welcome-text {
      margin-top: 18px;

      font-size: 24px;

      letter-spacing: 5px;

      color: white;

      text-shadow:
      0 0 12px rgba(0,0,0,0.8);
    }

    /* BOTTOM MENU */

    .bottom-menu {

      position: fixed;

      bottom: 28px;
      left: 50%;

      transform: translateX(-50%);

      width: auto;

      display: flex;

      gap: 18px;

      padding: 14px;

      border-radius: 999px;

      background: rgba(255,255,255,0.12);

      backdrop-filter: blur(16px);

      border: 1px solid rgba(255,255,255,0.18);

      box-shadow:
      0 0 30px rgba(0,0,0,0.28);

      z-index: 25;
    }

    .menu-item {

      border: none;

      background: transparent;

      color: white;

      min-width: 160px;

      height: 78px;

      border-radius: 999px;

      font-size: 18px;
      font-weight: 500;

      cursor: pointer;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 6px;

      transition: 0.25s;
    }

    .menu-item:hover {

      background: rgba(255,255,255,0.18);

      transform: translateY(-2px);

    }

    .menu-item.active {

      background: rgba(255,215,120,0.22);

      color: white;

      box-shadow:
      0 0 18px rgba(255,215,120,0.18);

    }

    .menu-icon {

      font-size: 24px;

      opacity: 0.92;
    }

    /* MUSIC BUTTON */

    #musicStart {

      position: fixed;

      bottom: 130px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 40;

      padding: 12px 24px;

      border-radius: 999px;

      border: 1px solid rgba(255,255,255,0.25);

      background: rgba(0,0,0,0.55);

      color: white;

      font-size: 16px;

      cursor: pointer;

      backdrop-filter: blur(10px);

      transition: 0.25s;
    }

    #musicStart:hover {

      background: rgba(255,255,255,0.15);

    }

    /* MOBILE */

    @media (max-width: 900px) {

      .top-bar {
        top: 12px;
        left: 12px;
        right: 12px;

        font-size: 14px;
      }

      .top-info {
        gap: 10px;
        padding: 8px 12px;
      }

      .top-icon {
        width: 38px;
        height: 38px;
        font-size: 18px;
      }

      .main-logo {
        top: 100px;
      }

      .logo {
        width: 260px;
      }

      .welcome-text {
        font-size: 15px;
      }

      .bottom-menu {
        gap: 8px;
        padding: 10px;
      }

      .menu-item {
        min-width: 95px;
        height: 60px;
        font-size: 13px;
      }

      .menu-icon {
        font-size: 18px;
      }

    }

  </style>
</head>

<body>

  <!-- BACKGROUND VIDEO -->

  <video class="background-video" autoplay muted loop playsinline>
    <source src="mirage.mp4" type="video/mp4">
  </video>

  <!-- BACKGROUND MUSIC -->

  <audio id="bgMusic" loop>
    <source src="mfcc-las-vegas-las-vegas-casino-music-385955.mp3" type="audio/mpeg">
  </audio>

  <!-- START MUSIC BUTTON -->

  <button id="musicStart" onclick="startMusic()">
    Tap to Start Music
  </button>

  <!-- OVERLAY -->

  <div class="overlay"></div>

  <!-- TOP BAR -->

  <div class="top-bar">

    <div class="top-info">

      <span>☾</span>

      <a id="temp"
         class="weather-link"
         href="https://weather.com/us/nevada/city/las-vegas/today"
         target="_blank">

        Loading°F

      </a>

      <span>|</span>

      <span id="date">Loading...</span>

      <span id="clock">--:--</span>

    </div>

    <div class="top-icons">

      <div class="top-icon">☰</div>

      <div class="top-icon">⏰</div>

      <div class="top-icon"
           onclick="toggleMusic()"
           id="muteButton">

        🔊

      </div>

    </div>

  </div>

  <!-- MAIN LOGO -->

  <div class="main-logo">

    <img src="Mirage logo 2.png"
         alt="Mirage Logo"
         class="logo">

    <div class="welcome-text">
      WELCOME, KEVIN MCCANN
    </div>

  </div>

  <!-- BOTTOM MENU -->

  <div class="bottom-menu">

    <!-- HOTEL INFO -->

    <button class="menu-item active"
      onclick="window.open('https://en.wikipedia.org/wiki/The_Mirage', '_blank')">

      <div class="menu-icon">▦</div>

      Hotel Info

    </button>

    <!-- TV -->

    <button class="menu-item"
      onclick="window.open('https://stream.directv.com/watchnow', '_blank')">

      <div class="menu-icon">▣</div>

      TV

    </button>

    <!-- MESSAGES -->

    <button class="menu-item"
      onclick="window.open('https://messages.google.com/web/u/1/conversations', '_blank')">

      <div class="menu-icon">✉</div>

      Messages

    </button>

  </div>

  <script>

    // CLOCK

    function updateClock() {

      const now = new Date();

      document.getElementById("clock").innerHTML =
        now.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        });

      document.getElementById("date").innerHTML =
        now.toLocaleDateString([], {
          weekday: "long",
          month: "numeric",
          day: "numeric",
          year: "numeric"
        });

    }

    updateClock();

    setInterval(updateClock, 1000);

    // WEATHER

    async function updateWeather() {

      try {

        const response = await fetch(
          "https://api.open-meteo.com/v1/forecast?latitude=36.1699&longitude=-115.1398&current=temperature_2m&temperature_unit=fahrenheit"
        );

        const data = await response.json();

        const temp = Math.round(data.current.temperature_2m);

        document.getElementById("temp").innerHTML = temp + "°F";

      } catch (error) {

        document.getElementById("temp").innerHTML = "Weather";

      }

    }

    updateWeather();

    setInterval(updateWeather, 600000);

    // START MUSIC

    function startMusic() {

      const music = document.getElementById("bgMusic");

      const button = document.getElementById("musicStart");

      music.volume = 0.45;

      music.play();

      button.style.display = "none";

    }

    // MUTE BUTTON

    function toggleMusic() {

      const music = document.getElementById("bgMusic");

      const button = document.getElementById("muteButton");

      if (music.muted) {

        music.muted = false;

        button.innerHTML = "🔊";

      } else {

        music.muted = true;

        button.innerHTML = "🔇";

      }

    }

  </script>

</body>
</html>
